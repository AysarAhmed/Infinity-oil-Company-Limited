<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Infinity Oil — Brand Intro</title>
<style>
  :root{
    --brand-blue: #0038A4;
    --brand-gold: #FEBD02;
    --bg-navy-1: #0d2456;
    --bg-navy-2: #051029;
    --bg-navy-3: #020712;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    height:100%;
    background:var(--bg-navy-3);
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .ambient-glow{
    position:fixed;
    inset:0;
    background:radial-gradient(circle at 50% 42%, var(--bg-navy-1) 0%, var(--bg-navy-2) 55%, var(--bg-navy-3) 100%);
    z-index:-1;
  }

  .scene{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:30px;
    padding:20px;
  }

  .stage{
    position:relative;
    width:min(62vw, 360px);
    aspect-ratio:1/1;
  }

  .glow-ring{
    position:absolute;
    inset:-14%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(254,189,2,0.20), rgba(0,56,164,0.16) 45%, transparent 72%);
    filter:blur(20px);
    opacity:0;
  }
  .stage.play .glow-ring{
    animation: glowIn 1.6s ease-out 0.9s forwards;
  }

  .trail{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  .trail path{
    fill:none;
    stroke-linecap:round;
    stroke-width:15;
    stroke-dasharray:100;
    stroke-dashoffset:100;
  }
  .trail-blue{
    stroke:var(--brand-blue);
    filter: drop-shadow(0 0 7px rgba(0,56,164,0.7));
  }
  .trail-gold{
    stroke:var(--brand-gold);
    filter: drop-shadow(0 0 7px rgba(254,189,2,0.7));
  }
  .stage.play .trail-gold{
    animation:
      drawPath 1.05s cubic-bezier(.65,0,.35,1) 0.15s forwards,
      fadeOutTrail 0.4s ease 1.25s forwards;
  }
  .stage.play .trail-blue{
    animation:
      drawPath 1.05s cubic-bezier(.65,0,.35,1) 0.32s forwards,
      fadeOutTrail 0.4s ease 1.25s forwards;
  }

  .logo-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border-radius:50%;
    opacity:0;
    transform:scale(0.86);
    display:block;
  }
  .stage.play .logo-img{
    animation: revealLogo 0.65s cubic-bezier(.34,1.56,.64,1) 1.35s forwards;
  }

  .shine{
    position:absolute;
    inset:0;
    border-radius:50%;
    overflow:hidden;
    pointer-events:none;
  }
  .shine::before{
    content:"";
    position:absolute;
    top:-30%;
    left:-60%;
    width:36%;
    height:160%;
    background:linear-gradient(75deg, transparent, rgba(255,255,255,0.55), transparent);
    transform:translateX(-40%);
    opacity:0;
  }
  .stage.play .shine::before{
    animation: shineSweep 0.95s ease 2.05s forwards;
  }

  .stage.play{
    animation: breathe 3.6s ease-in-out 2.7s infinite;
  }

  @keyframes glowIn{ to{ opacity:1; } }
  @keyframes drawPath{ to{ stroke-dashoffset:0; } }
  @keyframes fadeOutTrail{ to{ opacity:0; } }
  @keyframes revealLogo{ to{ opacity:1; transform:scale(1); } }
  @keyframes shineSweep{
    0%{ transform:translateX(-40%); opacity:0; }
    15%{ opacity:0.9; }
    100%{ transform:translateX(340%); opacity:0; }
  }
  @keyframes breathe{
    0%, 100%{ transform:scale(1); }
    50%{ transform:scale(1.015); }
  }

  .replay{
    opacity:0;
    pointer-events:none;
    background:transparent;
    border:1px solid rgba(255,255,255,0.28);
    color:rgba(255,255,255,0.85);
    font:600 11px/1 'Segoe UI', system-ui, sans-serif;
    letter-spacing:0.14em;
    text-transform:uppercase;
    padding:11px 24px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .25s ease, color .25s ease, opacity .4s ease;
  }
  .replay.show{
    opacity:1;
    pointer-events:auto;
  }
  .replay:hover{
    border-color:var(--brand-gold);
    color:var(--brand-gold);
  }
  .replay:focus-visible{
    outline:2px solid var(--brand-gold);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    .trail, .shine, .glow-ring{ display:none; }
    .logo-img{ opacity:1; transform:scale(1); animation:none; }
    .stage.play{ animation:none; }
  }
</style>
</head>

    <button class="replay" id="replay" type="button" aria-label="Replay animation">Replay</button>
  </div>

<script>
  const stage = document.getElementById('stage');
  const replay = document.getElementById('replay');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const REVEAL_DELAY = reduced ? 200 : 3000;
  let timer = null;

  function armReplay(){
    replay.classList.remove('show');
    clearTimeout(timer);
    timer = setTimeout(() => replay.classList.add('show'), REVEAL_DELAY);
  }

  replay.addEventListener('click', () => {
    stage.classList.remove('play');
    replay.classList.remove('show');
    void stage.offsetWidth; // force reflow to restart CSS animations
    requestAnimationFrame(() => {
      stage.classList.add('play');
      armReplay();
    });
  });

  armReplay();
</script>
